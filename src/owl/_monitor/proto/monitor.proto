syntax = "proto3";

package owl.monitor;

// Owl 训练监控服务。
service MonitorService {
  // 返回当前监控状态。
  rpc Health(HealthRequest) returns (HealthResponse);

  // 返回当前 ring 中缓存的快照。
  rpc GetWindow(GetWindowRequest) returns (GetWindowResponse);

  // 持续返回 seq 大于 last_seq 的快照。
  rpc StreamSnapshots(StreamSnapshotsRequest) returns (stream Snapshot);
}

message HealthRequest {}

message HealthResponse {
  // 监控服务是否可用。
  bool ok = 1;

  // 当前最新快照序号。
  uint64 seq = 2;

  // ring 最大缓存容量。
  uint32 buffer_size = 3;

  // 当前 ring 中已缓存的快照数量。
  uint32 cached = 4;
}

message GetWindowRequest {}

message GetWindowResponse {
  // 当前缓存窗口中的快照，按 seq 升序排列。
  repeated Snapshot snapshots = 1;
}

message StreamSnapshotsRequest {
  // 客户端已经收到的最新快照序号。
  uint64 last_seq = 1;
}

message Snapshot {
  // 全局递增快照序号。
  uint64 seq = 1;

  // 当前 epoch。
  int64 epoch = 2;

  // 当前 step。
  int64 step = 3;

  // Unix 时间戳，单位为秒。
  double timestamp = 4;

  // 快照名称，例如 train。
  string name = 5;

  // 模型侧指标。
  map<string, string> model_metrics = 6;

  // 损失函数侧指标。
  map<string, string> loss_metrics = 7;
}